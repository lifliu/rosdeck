name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [fix/foxglove-connection]
    paths:
      - 'package.json'
      - 'app.json'
      - 'lib/**'
      - 'components/**'
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Approve Skia scripts
        run: npm approve-scripts @shopify/react-native-skia || true

      - name: Install Skia prebuilt binaries
        run: node node_modules/@shopify/react-native-skia/scripts/install-skia.mjs

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Pre-build Expo (generate Android project)
        run: npx expo prebuild --platform android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnideck-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30