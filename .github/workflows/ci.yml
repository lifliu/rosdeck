name: CI

# Phase 4 (reliability/ops): App and App-facing gateway CI.
#   python  -> ruff lint + no-ROS omni_ws_gateway unit tests
#   app     -> tsc typecheck + jest
# Job-level path gates via dorny/paths-filter so a docs-only PR is cheap.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-22.04
    outputs:
      robot: ${{ steps.filter.outputs.robot }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            robot:
              - 'robot/**'
              - '.github/workflows/ci.yml'
            app:
              - 'app/**'
              - 'components/**'
              - 'constants/**'
              - 'hooks/**'
              - 'lib/**'
              - 'modules/**'
              - 'stores/**'
              - 'types/**'
              - 'widgets/**'
              - '__tests__/**'
              - '__mocks__/**'
              - 'assets/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'jest.config.js'
              - 'jest.setup.js'
              - '.github/workflows/ci.yml'

  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.robot == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff==0.16.3
      - name: Lint robot Python
        run: ruff check robot/

  python-test:
    name: Python unit tests (no ROS)
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.robot == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
      - name: omni_ws_gateway
        run: python3 -m unittest discover -s robot/omni_ws_gateway/test -v

  gateway-package-smoke:
    name: Gateway colcon install + ros2 run smoke
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    needs: changes
    if: needs.changes.outputs.robot == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install colcon
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions
      - name: Verify ROS package executable layout
        run: bash robot/omni_ws_gateway/test/test_colcon_install_smoke.sh

  app:
    name: App typecheck + unit tests
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx jest --ci
