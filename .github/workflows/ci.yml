name: CI

# Phase 4 (reliability/ops): App and App-facing gateway CI.
#   python  -> ruff lint + no-ROS omni_ws_gateway unit tests
#   app     -> tsc typecheck + jest
# Job-level path gates via dorny/paths-filter so a docs-only PR is cheap.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup-old-storage:
    name: Cleanup old artifacts and caches
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Remove old artifacts and caches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // --- Part 1: Clean old artifacts (keep only latest 1 per name) ---
            const allArtifacts = [];
            {
              let page = 1;
              while (true) {
                const result = await github.request('GET /repos/{owner}/{repo}/actions/artifacts', {
                  owner, repo, per_page: 100, page
                });
                allArtifacts.push(...result.data.artifacts);
                if (result.data.artifacts.length < 100) break;
                page++;
              }
              const byName = {};
              for (const a of allArtifacts) {
                if (!byName[a.name]) byName[a.name] = [];
                byName[a.name].push(a);
              }
              const keep = new Set();
              for (const [name, artifacts] of Object.entries(byName)) {
                artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                for (let i = 0; i < Math.min(1, artifacts.length); i++) {
                  keep.add(artifacts[i].id);
                }
              }
              let deleted = 0;
              for (const a of allArtifacts) {
                if (!keep.has(a.id)) {
                  try {
                    await github.request('DELETE /repos/{owner}/{repo}/actions/artifacts/{artifact_id}', {
                      owner, repo, artifact_id: a.id
                    });
                    deleted++;
                  } catch (e) {
                    if (e.status !== 404) console.warn(`Failed to delete artifact ${a.id}: ${e.message}`);
                  }
                }
              }
              console.log(`Artifacts: total=${allArtifacts.length}, kept=${keep.size}, deleted=${deleted}`);
            }

            // --- Part 2: Clean old caches (keep only latest 1 per prefix) ---
            const allCaches = [];
            {
              let page = 1;
              while (true) {
                const result = await github.request('GET /repos/{owner}/{repo}/actions/caches', {
                  owner, repo, per_page: 100, page
                });
                allCaches.push(...result.data.actions_caches);
                if (result.data.actions_caches.length < 100) break;
                page++;
              }
              // Group by prefix (setup-go, node-cache)
              const byPrefix = {};
              for (const c of allCaches) {
                const prefix = c.key.split('-')[0] + (c.key.split('-')[1] ? '-' + c.key.split('-')[1] : '');
                if (!byPrefix[prefix]) byPrefix[prefix] = [];
                byPrefix[prefix].push(c);
              }
              const keep = new Set();
              for (const [prefix, caches] of Object.entries(byPrefix)) {
                // Keep the most recently used cache per prefix
                caches.sort((a, b) => new Date(b.last_used_at) - new Date(a.last_used_at));
                for (let i = 0; i < Math.min(1, caches.length); i++) {
                  keep.add(caches[i].id);
                }
              }
              let deleted = 0;
              for (const c of allCaches) {
                if (!keep.has(c.id)) {
                  try {
                    await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{ref}', {
                      owner, repo, ref: c.id
                    });
                    deleted++;
                  } catch (e) {
                    if (e.status !== 404) console.warn(`Failed to delete cache ${c.id}: ${e.message}`);
                  }
                }
              }
              console.log(`Caches: total=${allCaches.length}, kept=${keep.size}, deleted=${deleted}`);
            }

  changes:
    name: Detect changed paths
    runs-on: ubuntu-22.04
    needs: cleanup-old-storage
    outputs:
      robot: ${{ steps.filter.outputs.robot }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            robot:
              - 'robot/**'
              - '.github/workflows/ci.yml'
            app:
              - 'app/**'
              - 'components/**'
              - 'constants/**'
              - 'hooks/**'
              - 'lib/**'
              - 'modules/**'
              - 'stores/**'
              - 'types/**'
              - 'widgets/**'
              - '__tests__/**'
              - '__mocks__/**'
              - 'assets/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'jest.config.js'
              - 'jest.setup.js'
              - '.github/workflows/ci.yml'

  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.robot == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff==0.16.3
      - name: Lint robot Python
        run: ruff check robot/

  python-test:
    name: Python unit tests (no ROS)
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.robot == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.10"
      - name: omni_ws_gateway
        run: python3 -m unittest discover -s robot/omni_ws_gateway/test -v

  gateway-package-smoke:
    name: Gateway colcon install + ros2 run smoke
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    needs: changes
    if: needs.changes.outputs.robot == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install colcon
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-colcon-common-extensions
      - name: Verify ROS package executable layout
        run: bash robot/omni_ws_gateway/test/test_colcon_install_smoke.sh

  app:
    name: App typecheck + unit tests
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx jest --ci
