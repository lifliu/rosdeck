name: CI

# Phase 4 (reliability/ops): first CI for the rosdeck monorepo.
#   python  -> ruff lint + no-ROS unit tests (omni_docking, omni_mission_manager)
#   app     -> tsc typecheck + jest
# Job-level path gates via dorny/paths-filter so a docs-only PR is cheap.
#
# The C++ bridge build/test jobs live in ci-robot-cpp.yml (manual only for
# now): they need a CI_GIT_TOKEN repo secret because GITHUB_TOKEN cannot
# read the private interface repos (lifliu/omni_robot_interfaces,
# YanYaoyuan/omni_slam).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-22.04
    outputs:
      robot: ${{ steps.filter.outputs.robot }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            robot:
              - 'robot/**'
              - '.github/workflows/ci.yml'
            app:
              - 'app/**'
              - 'components/**'
              - 'constants/**'
              - 'hooks/**'
              - 'lib/**'
              - 'modules/**'
              - 'stores/**'
              - 'types/**'
              - 'widgets/**'
              - '__tests__/**'
              - '__mocks__/**'
              - 'assets/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'jest.config.js'
              - 'jest.setup.js'
              - '.github/workflows/ci.yml'

  python-lint:
    name: Python lint (ruff)
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.robot == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: pip install ruff==0.16.3
      - name: Lint robot Python
        run: ruff check robot/

  python-test:
    name: Python unit tests (no ROS)
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.robot == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: omni_docking
        run: python3 -m unittest discover -s robot/omni_docking/test -v
      - name: omni_mission_manager
        run: python3 -m unittest discover -s robot/omni_mission_manager/test -v

  app:
    name: App typecheck + unit tests
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx jest --ci