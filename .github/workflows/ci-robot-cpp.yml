name: CI (C++ bridge)

# Phase 4: ROS 2 Humble colcon build + test for the C++ bridge
# (rosdeck_robot_bridge), including an ASan/UBSan variant.
#
# MANUAL ONLY until the CI_GIT_TOKEN repo secret exists:
#
#   The workspace needs two PRIVATE repos — lifliu/omni_robot_interfaces
#   and YanYaoyuan/omni_slam (subpackage omni_slam_interfaces). GITHUB_TOKEN
#   cannot read private repos other than the triggering one, so the
#   checkout steps authenticate with the CI_GIT_TOKEN secret instead.
#
#   To enable: CI_GIT_TOKEN must be a token of an account that can read
#   BOTH repos. A fine-grained PAT only grants repos its owner administers,
#   so one fine-grained token cannot cover both here (lifliu is only a
#   collaborator on omni_slam — the repo is unselectable in the UI). Use a
#   CLASSIC PAT instead (Settings -> Developer settings -> Personal access
#   tokens -> Tokens (classic) -> Generate new token (classic)), scope:
#   repo, then in rosdeck:
#       Settings -> Secrets and variables -> Actions -> New repository secret
#       CI_GIT_TOKEN = <token>
#   (Least-privilege alternative: a fine-grained token from each repo
#   owner and two secrets — the checkout steps would need a second token.)
#   Run this workflow manually and watch both jobs go green; afterwards it
#   can be added to the regular CI triggers.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  robot-cpp:
    name: ROS 2 Humble build + test (C++ bridge)
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    env:
      ROS_WS: ${{ github.workspace }}/ws
    steps:
      - name: Checkout rosdeck
        uses: actions/checkout@v4
        with:
          path: ws
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git python3-colcon-common-extensions
      # The private interface repos go in beside rosdeck inside ws/; ws/ is
      # the colcon workspace root (packages are discovered at any depth).
      - name: Checkout omni_robot_interfaces (private)
        uses: actions/checkout@v4
        with:
          repository: lifliu/omni_robot_interfaces
          ref: main
          fetch-depth: 1
          path: ws/omni_robot_interfaces
          token: ${{ secrets.CI_GIT_TOKEN || github.token }}
      - name: Checkout omni_slam interfaces (private)
        uses: actions/checkout@v4
        with:
          repository: YanYaoyuan/omni_slam
          ref: main
          fetch-depth: 1
          path: ws/omni_slam
          token: ${{ secrets.CI_GIT_TOKEN || github.token }}
      - name: Build
        run: |
          . /opt/ros/humble/setup.bash
          cd "${ROS_WS}"
          colcon build \
            --packages-select omni_robot_interfaces omni_slam_interfaces rosdeck_robot_bridge \
            --cmake-args -DCMAKE_BUILD_TYPE=Release \
              -DROSDECK_BUILD_VBOT_ADAPTER=OFF -DROSDECK_BUILD_ZSIBOT_ADAPTER=OFF \
            --event-handlers console_direct+
      - name: Test
        run: |
          . /opt/ros/humble/setup.bash
          cd "${ROS_WS}"
          colcon test --packages-select rosdeck_robot_bridge \
            --event-handlers console_direct+
          colcon test-result --verbose
      - name: Upload colcon logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs-${{ github.run_id }}
          path: "${ROS_WS}/log"
          retention-days: 3

  robot-cpp-asan:
    name: ROS 2 Humble ASan/UBSan build + test
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    env:
      ROS_WS: ${{ github.workspace }}/ws
    steps:
      - name: Checkout rosdeck
        uses: actions/checkout@v4
        with:
          path: ws
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git python3-colcon-common-extensions \
            libasan5 libubsan1
      - name: Checkout omni_robot_interfaces (private)
        uses: actions/checkout@v4
        with:
          repository: lifliu/omni_robot_interfaces
          ref: main
          fetch-depth: 1
          path: ws/omni_robot_interfaces
          token: ${{ secrets.CI_GIT_TOKEN || github.token }}
      - name: Checkout omni_slam interfaces (private)
        uses: actions/checkout@v4
        with:
          repository: YanYaoyuan/omni_slam
          ref: main
          fetch-depth: 1
          path: ws/omni_slam
          token: ${{ secrets.CI_GIT_TOKEN || github.token }}
      - name: Build (ASan + UBSan)
        run: |
          . /opt/ros/humble/setup.bash
          cd "${ROS_WS}"
          colcon build \
            --packages-select omni_robot_interfaces omni_slam_interfaces rosdeck_robot_bridge \
            --cmake-args -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
              -DROSDECK_BUILD_VBOT_ADAPTER=OFF -DROSDECK_BUILD_ZSIBOT_ADAPTER=OFF \
            --event-handlers console_direct+
      - name: Test (ASan + UBSan)
        run: |
          . /opt/ros/humble/setup.bash
          cd "${ROS_WS}"
          colcon test --packages-select rosdeck_robot_bridge \
            --event-handlers console_direct+
          colcon test-result --verbose
      - name: Upload colcon logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs-asan-${{ github.run_id }}
          path: "${ROS_WS}/log"
          retention-days: 3